server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    # 重点：history模式，刷新不404
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 接口反向代理：/api 转发后端，且必须去掉 /api 前缀
    # （后端 Controller 上是 /user、/project...，没有 /api；结尾的 / 会做前缀替换）
    location /api/ {
        proxy_pass http://charity-backend:8080/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # 静态资源（项目封面、证明材料、举报图片、头像）
    location /images/ {
        proxy_pass http://charity-backend:8080/images/;
        proxy_set_header Host $host;
        expires 7d;
    }
}
